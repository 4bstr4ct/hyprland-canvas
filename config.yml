# Canvas — Hyprland Infinite Desktop configuration
# Copy to ~/.config/canvas/config.yml and customize

speed: 1.6
# max_speed: 50              # optional: cap per-frame cursor delta (pixels)

navigation:
  cooldown: 0.2              # seconds between navigation steps
  protected_apps:             # these apps won't steal focus during navigation
    - brave-browser
    - chromium
    - chromium-browser
    - google-chrome
    - firefox
    - firefoxdeveloperedition
    - librewolf
    - vivaldi
    - opera
    - microsoft-edge

invert:
  enabled: true               # true = grab canvas (intuitive), false = follow cursor
